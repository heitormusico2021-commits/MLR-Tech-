<main>
    <section class="formulario">
    <form action="#" method="post">

        <h2>Entre em Contato</h2>
        <p>Preenche o formulario abaixo para acessar nossos serviços</p>

    <div class="formulario-contato">
        <label for="Nome completo">Nome Completo:</label>
        <input type="text" name="nome" placeholder="Digite seu nome" required>
    </div>

    <div class="formulario-contato">
        <label for="E-mail">E-mail:</label>
        <input type="E-mail" name="email" placeholder="Digite seu e-mail" required>
    </div>

    <div class="formulario-contato">
        <label for="Telefone">Telefone:</label>
        <input type="Telefone" name="Telefone" placeholder="(XX)XXXXX-XXXX" required>
    </div>
    <div class="formulario-contato">
        <label for="assunto">Assunto:</label>
        <input list="assuntos" name="Assunto">
    <datalist id="assuntos">
        <option value="Montagem de pc">
        <option value="assistência tecnica para dispositivos">
        <option value="Ajuda com os produtos">
        <option value="contratação de serviços">
        <option value="Outros assuntos">
    </div>

    <div class="formulario-contato">
        <label for="mensagem">Mensagem:</label>
        <textarea name="mensagem" rows="6" required></textarea>
        </div>
        <button id="envia" type="submit">Enviar</button>
        <button id="reseta" type="reset">Resetar</button>
    </form>
    </section>

</main>
